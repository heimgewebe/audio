name: Whale Source Export Temp
on:
  pull_request:
    paths:
      - .github/workflows/whale-source-export-temp.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Collect exact integration sources
        run: |
          mkdir -p /tmp/whale-source-export/scripts /tmp/whale-source-export/tests /tmp/whale-source-export/profiles
          cp scripts/whale_morph_engine.py /tmp/whale-source-export/scripts/
          cp scripts/whale_source_filter_engine.py /tmp/whale-source-export/scripts/
          cp scripts/whale_organic_engine.py /tmp/whale-source-export/scripts/
          cp scripts/whale_live.py /tmp/whale-source-export/scripts/
          cp tests/test_whale_morph_engine.py /tmp/whale-source-export/tests/
          cp tests/test_whale_organic_engine.py /tmp/whale-source-export/tests/
          cp tests/test_whale_live.py /tmp/whale-source-export/tests/
          cp profiles/buckelwal-live-voice-v1.json /tmp/whale-source-export/profiles/
      - name: Upload exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: whale-source-export-temp
          path: /tmp/whale-source-export
          if-no-files-found: error
          retention-days: 1
