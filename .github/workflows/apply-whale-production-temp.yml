name: Apply Whale Production Temp
on:
  push:
    branches:
      - fix/whale-low-register-source-clock-20260829
    paths:
      - .whale-production.patch
      - .github/workflows/apply-whale-production-temp.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/whale-low-register-source-clock-20260829
      - name: Apply exact locally validated patch
        run: |
          git apply --check .whale-production.patch
          git apply .whale-production.patch
          git rm .whale-production.patch .github/workflows/apply-whale-production-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/whale_morph_engine.py tests/test_whale_morph_engine.py tests/test_whale_organic_engine.py profiles/buckelwal-live-voice-v1.json
          git commit -m "fix(whale): decouple low-register source texture clock"
          git push origin HEAD:fix/whale-low-register-source-clock-20260829
