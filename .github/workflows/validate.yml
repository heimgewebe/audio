name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run safety negative controls
        run: bash tests/test-audio-safety.sh
      - name: Check repository audio surfaces
        run: bash scripts/check-audio-safety .
      - name: Test read-only baseline capture
        run: python3 -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python3 -m compileall -q scripts tests
      - name: Verify user systemd units
        run: >-
          systemd-analyze --user verify
          systemd/user/audio-control-ui-v1.service
          systemd/user/audio-control-level-observer-v1.service
          systemd/user/audio-control-deploy.service
          systemd/user/audio-control-deploy.timer
