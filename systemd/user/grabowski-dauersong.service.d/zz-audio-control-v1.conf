# Repo-owned late drop-in for the existing Dauersong v9 performer.
# The filename intentionally sorts after the legacy volume.conf.
[Service]
Environment=GRABOWSKI_STREAM_VOLUME=100
Environment=AUDIO_DAUERSONG_MANAGED_BY=audio-control-v1
Environment=AUDIO_DAUERSONG_RUNTIME_MAX_SECONDS=21600
ExecStartPre=/usr/bin/python3 %h/.local/share/audio-control-ui/current/scripts/dauersong_live.py verify-host
Restart=no
RuntimeMaxSec=21600
MemoryMax=536870912
CPUQuota=150%
TasksMax=32
LimitNOFILE=1024
LogRateLimitIntervalSec=30s
LogRateLimitBurst=60
